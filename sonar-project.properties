# Troque pela chave do projeto criada no SonarQube / SonarCloud
sonar.projectKey=davi-carlos
sonar.organization=davi-carlos
sonar.projectName=Destinos do Brasil
sonar.projectVersion=1.0

# Se usar SonarCloud, descomente e coloque a sua organização:
# sonar.organization=polarzinha008

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# app.js só manipula o DOM (navegador); a cobertura é medida na lógica (filtros.js)
sonar.coverage.exclusions=src/app.js
